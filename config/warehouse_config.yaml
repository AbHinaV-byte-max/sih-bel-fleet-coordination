    - [18, 12]
    - [19, 9]
    - [19, 10]
    - [19, 11]
    - [19, 12]

  # Workstations and logistics hubs
  pickup_stations:
    - id: "PICKUP_A"
      location: [1, 2]
    - id: "PICKUP_B"
      location: [1, 8]
    - id: "PICKUP_C"
      location: [1, 14]

  dropoff_stations:
    - id: "DROPOFF_ALPHA"
      location: [22, 2]
    - id: "DROPOFF_BETA"
      location: [22, 8]
    - id: "DROPOFF_GAMMA"
      location: [22, 14]

  charging_pads:
    - id: "CHARGE_1"
      location: [6, 16]
    - id: "CHARGE_2"
      location: [11, 16]
    - id: "CHARGE_3"
      location: [16, 16]

  # Human-Presence Safety Zones (Speed derating & proactive clearance)
  human_zones:
    - id: "HUMAN_ZONE_MANUAL_INSPECTION"
      name: "Manual QA & Inspection Bay"
      active: true
      bounds: [10, 14, 15, 17]
      speed_derating_factor: 0.5
    - id: "HUMAN_ZONE_PACKING_STATION"
      name: "Tactical Kitting Station"
      active: true
      bounds: [20, 11, 23, 14]
      speed_derating_factor: 0.5

fleet:
  robot_types:
    LIGHT_RUNNER:
      description: "Agile scout and small component courier"
      max_speed: 1.5
      payload_capacity_kg: 50.0
      battery_capacity_ah: 80.0
      yield_priority_weight: 1
    STANDARD_HAULER:
      description: "Standard defense depot AMR for palletized payloads"
      max_speed: 1.0
      payload_capacity_kg: 250.0
      battery_capacity_ah: 120.0
      yield_priority_weight: 2
    HEAVY_CARRIER:
      description: "Heavy ordnance and heavy-machinery carrier"
      max_speed: 0.75
      payload_capacity_kg: 1000.0
      battery_capacity_ah: 200.0
      yield_priority_weight: 3

  initial_robots:
    - id: "AMR-01"
      type: "STANDARD_HAULER"
      start_pos: [1, 1]
      battery_level_pct: 95.0
    - id: "AMR-02"
      type: "LIGHT_RUNNER"
      start_pos: [1, 7]
      battery_level_pct: 88.0
    - id: "AMR-03"
      type: "HEAVY_CARRIER"
      start_pos: [1, 13]
      battery_level_pct: 92.0
    - id: "AMR-04"
      type: "STANDARD_HAULER"
      start_pos: [6, 1]
      battery_level_pct: 82.0
    - id: "AMR-05"
      type: "LIGHT_RUNNER"
      start_pos: [11, 1]
      battery_level_pct: 90.0
    - id: "AMR-06"
      type: "STANDARD_HAULER"
      start_pos: [16, 1]
      battery_level_pct: 85.0

coordination:
  intent_horizon_steps: 5
  time_step_duration_seconds: 0.5
  congestion_window_seconds: 60.0
  congestion_penalty_multiplier: 4.0
  predictive_maintenance:
    distance_km_threshold: 15.0
    operating_cycles_threshold: 40

broker:
  mode: "embedded"
  host: "127.0.0.1"
  port: 1883
  topic_prefix: "fleet"
